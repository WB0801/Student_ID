<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>学号处理工具 v1.0</title>

<style>
*{
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    margin:0;
    background:#f4f6fb;
    color:#333;
}

header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:18px;
    font-size:28px;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.container{
    width:95%;
    max-width:1400px;
    margin:25px auto;
}

.flex{
    display:flex;
    gap:20px;
}

.card{
    flex:1;
    background:white;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    padding:18px;
}

h3{
    margin-top:0;
}

textarea{
    width:100%;
    height:400px;
    resize:none;
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
    font-size:18px;
}

.stats{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.stat{
    flex:1;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    text-align:center;
    padding:18px;
}

.stat span{
    display:block;
    font-size:30px;
    font-weight:bold;
    color:#1976d2;
    margin-top:5px;
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:15px;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 24px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

#copyBtn{
    background:#1976d2;
    color:white;
}

#copyBtn:hover{
    background:#0f5db1;
}

#clearBtn{
    background:#666;
    color:white;
}

#clearBtn:hover{
    background:#444;
}

#duplicateBox{
    margin-top:20px;
    background:white;
    border-radius:10px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

#duplicateList{
    margin-top:10px;
    white-space:pre-line;
    font-size:17px;
}

.ok{
    color:green;
    font-weight:bold;
}

.warn{
    color:#d32f2f;
    font-weight:bold;
}
</style>

</head>

<body>

<header>
🎓 学号处理工具 v1.0
</header>

<div class="container">

<div class="flex">

<div class="card">

<h3>输入学号（每行一个）</h3>

<textarea id="input" placeholder="21001
23013
25032
23002"></textarea>

</div>

<div class="card">

<h3>连接结果（已自动去重）</h3>

<textarea id="output" readonly></textarea>

</div>

</div>

<div class="stats">

<div class="stat">
原始人数
<span id="original">0</span>
</div>

<div class="stat">
去重后人数
<span id="unique">0</span>
</div>

</div>

<div class="buttons">

<button id="copyBtn" onclick="copyResult()">
📋 一键复制
</button>

<button id="clearBtn" onclick="clearAll()">
🗑 清空
</button>

</div>

<div id="duplicateBox">

<h3>重复学号检查</h3>

<div id="duplicateList" class="ok">
✅ 没有重复学号
</div>

</div>

</div>

<script>

const input=document.getElementById("input");
const output=document.getElementById("output");

input.addEventListener("input",process);

function process(){

    let rows=input.value
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(x=>x!="");

    document.getElementById("original").innerText=rows.length;

    let map={};

    rows.forEach(id=>{
        map[id]=(map[id]||0)+1;
    });

    let unique=[];
    let seen=new Set();

    rows.forEach(id=>{
        if(!seen.has(id)){
            unique.push(id);
            seen.add(id);
        }
    });

    document.getElementById("unique").innerText=unique.length;

    output.value=unique.join("-");

    let duplicateText="";
    let duplicateCount=0;

    for(let id in map){

        if(map[id]>1){

            duplicateCount++;

            duplicateText+=`${id}（重复 ${map[id]} 次）\n`;

        }

    }

    const box=document.getElementById("duplicateList");

    if(duplicateCount==0){

        box.className="ok";
        box.innerHTML="✅ 没有重复学号";

    }else{

        box.className="warn";
        box.innerHTML=`⚠ 發現 ${duplicateCount} 個重複學號\n\n${duplicateText}`;

    }

}

async function copyResult(){

    if(output.value=="") return;

    try{

        await navigator.clipboard.writeText(output.value);

    }catch{

        output.select();
        document.execCommand("copy");

    }

    const btn=document.getElementById("copyBtn");

    btn.innerHTML="✅ 已复制";

    setTimeout(()=>{

        btn.innerHTML="📋 一键复制";

    },2000);

}

function clearAll(){

    input.value="";
    output.value="";

    document.getElementById("original").innerText=0;
    document.getElementById("unique").innerText=0;

    document.getElementById("duplicateList").className="ok";
    document.getElementById("duplicateList").innerHTML="✅ 没有重复学号";

}

process();

</script>

</body>
</html>
